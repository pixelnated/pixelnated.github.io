name: Fix Broken External Links

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  fix-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Check and fix broken links
        run: python .github/scripts/fix_broken_links.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix: replace broken links with Wayback Machine archives"
          title: "🔗 Fix broken external links"
          body: |
            This PR automatically replaces broken external links with archived versions from the Wayback Machine.
            
            Please review the changes to ensure the archived versions are appropriate.
          branch: fix-broken-links
          delete-branch: true
          labels: automated
